# proAV.Net Edge on a site. The installer (install.sh) writes .env and starts this; by hand: copy .env.example
# to .env, fill it in, then `docker compose up -d`. Processors point cloudConfig.host at this machine: port 8443
# over HTTPS with the edge's certificate fingerprint pinned, or port 8080 in plain HTTP.
services:
  edge:
    image: ghcr.io/proav-net/proav-edge:${EDGE_TAG:-latest}
    container_name: proav-edge
    restart: unless-stopped
    environment:
      EDGE_NAME: ${EDGE_NAME:-}
      EDGE_CLOUD_HOST: ${EDGE_CLOUD_HOST:?set EDGE_CLOUD_HOST (e.g. test.proav.cloud)}
      EDGE_CLOUD_SECURE: ${EDGE_CLOUD_SECURE:-true}
      EDGE_CLOUD_API_KEY: ${EDGE_CLOUD_API_KEY:-}
      EDGE_ENROLMENT_MODE: ${EDGE_ENROLMENT_MODE:-Pairing}
      EDGE_PROXY_MODE: ${EDGE_PROXY_MODE:-None}
      EDGE_PROXY_URL: ${EDGE_PROXY_URL:-}
      EDGE_PROXY_USERNAME: ${EDGE_PROXY_USERNAME:-}
      EDGE_PROXY_PASSWORD: ${EDGE_PROXY_PASSWORD:-}
      EDGE_PROXY_BYPASS: ${EDGE_PROXY_BYPASS:-}
      EDGE_RELAY_HTTP_PORT: 8080
      # HTTPS on by default: without a PFX the edge generates a self-signed certificate (kept in edge-data) that
      # processors pin by fingerprint. Set EDGE_RELAY_HTTPS_PORT=0 to run plain HTTP only.
      EDGE_RELAY_HTTPS_PORT: ${EDGE_RELAY_HTTPS_PORT:-8443}
      EDGE_RELAY_CERT_PATH: ${EDGE_RELAY_CERT_PATH:-}
      EDGE_RELAY_CERT_PASSWORD: ${EDGE_RELAY_CERT_PASSWORD:-}
      EDGE_ADMIN_PORT: 8090
      EDGE_ADMIN_USERNAME: ${EDGE_ADMIN_USERNAME:-admin}
      EDGE_ADMIN_PASSWORD: ${EDGE_ADMIN_PASSWORD:?set EDGE_ADMIN_PASSWORD for the dashboard}
      # Self-update from the dashboard, through the updater service below.
      EDGE_UPDATES_CHANNEL: ${EDGE_UPDATES_CHANNEL:-next}
      EDGE_UPDATES_VERIFY: ${EDGE_UPDATES_VERIFY:-true}
      # System proxy mode reads these, the same variables curl and apt honour.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    ports:
      - "${EDGE_RELAY_PORT:-8080}:8080"
      - "${EDGE_RELAY_HTTPS_PORT_PUBLISH:-8443}:${EDGE_RELAY_HTTPS_PORT:-8443}"
      - "${EDGE_ADMIN_PORT_PUBLISH:-8090}:8090"
    volumes:
      - edge-data:/data
      - edge-run:/run/proav-edge
      # Put the PFX for the HTTPS relay port in ./certs and set EDGE_RELAY_CERT_PATH=/certs/edge.pfx
      - ./certs:/certs:ro

  # The updater: the same image with the Docker socket, reached by the edge over a Unix socket in edge-run.
  # It replaces the edge container on request (pull, verify signature, swap, health gate, else restore).
  # Mounting /var/run/docker.sock gives this container root-equivalent access to the host; it has no
  # network port, and only the edge's dashboard (behind its password) can ask it to do anything.
  updater:
    image: ghcr.io/proav-net/proav-edge:${EDGE_TAG:-latest}
    container_name: proav-edge-updater
    command: ["--updater"]
    # Root inside its container: the Docker socket is root:docker (or root:root) on the host and the image's
    # unprivileged user cannot open it. The updater already has root-equivalent power through that socket, so
    # this adds nothing; the edge container itself stays unprivileged.
    user: "0:0"
    restart: unless-stopped
    environment:
      EDGE_ROLE: updater
      EDGE_UPDATER_TARGET: proav-edge
      EDGE_UPDATER_IMAGE: ghcr.io/proav-net/proav-edge
      EDGE_UPDATER_VERIFY: ${EDGE_UPDATES_VERIFY:-true}
      # cosign reaches the Sigstore transparency log through the same proxy as everything else.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - edge-run:/run/proav-edge

volumes:
  edge-data:
  edge-run:
